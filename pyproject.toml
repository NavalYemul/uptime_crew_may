[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "day1-ai-foundations"
version = "0.1.0"
description = "Day 1 — Python for AI Systems: Data Engineering & AI Bootcamp"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "nltk>=3.8",
    "gensim>=4.3",
    "pytest>=8.2",
    "jupyter>=1.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src/day1"]
