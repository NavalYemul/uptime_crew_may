[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "day5-enterprise-rag-deployment"
version = "0.1.0"
description = "Day 5 — Enterprise RAG, Multi-Agent Orchestration & Deployment"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "langgraph>=0.6",
    "langgraph-checkpoint>=2.1",
    "langgraph-prebuilt>=0.6",
    "langsmith>=0.4",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "tiktoken>=0.7",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "jupyter>=1.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
pdf = ["pypdf>=4.0"]
search = ["ddgs>=6.0"]
all = ["streamlit>=1.30", "pypdf>=4.0", "ddgs>=6.0"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
addopts    = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src/day5"]
