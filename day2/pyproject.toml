[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "day2-embeddings-rag"
version = "0.1.0"
description = "Day 2 — Embeddings, Vector Search, RAG & Data Pipelines"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "huggingface-hub>=0.23",
    "python-dotenv>=1.0",
    "pandera>=0.19",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pytest>=8.2",
    "jupyter>=1.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-classic>=1.0",
    "langchain-text-splitters>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "tiktoken>=0.7",
    "openai>=1.0",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.1"]
ragas     = ["ragas>=0.1"]
spark     = ["pyspark>=3.5"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
addopts    = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src/day2"]
