[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "day3-advanced-rag"
version = "0.1.0"
description = "Day 3 — Advanced RAG: Hybrid Search, Reranking, Evaluation & Airflow"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-text-splitters>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "tiktoken>=0.7",
    "openai>=1.0",
    "anthropic>=0.30",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pytest>=8.2",
    "jupyter>=1.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.1"]
ragas     = ["ragas>=0.1"]
airflow   = ["apache-airflow>=2.9"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
addopts    = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src/day3"]
